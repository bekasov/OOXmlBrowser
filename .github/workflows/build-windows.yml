name: Build Windows
permissions:
  contents: write

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: false
        default: 'snapshot'

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
              mingw-w64-ucrt-x86_64-gtk4
              mingw-w64-ucrt-x86_64-gtksourceview5
              mingw-w64-ucrt-x86_64-python-lxml
              mingw-w64-ucrt-x86_64-python-gobject
              mingw-w64-ucrt-x86_64-cairo
              mingw-w64-ucrt-x86_64-python-pip
              mingw-w64-ucrt-x86_64-tidy
              mingw-w64-ucrt-x86_64-gobject-introspection
              mingw-w64-ucrt-x86_64-pyinstaller-hooks-contrib

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Set version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $VERSION = "${{ github.event.inputs.version }}"
          } else {
            $VERSION = "$env:GITHUB_REF_NAME" -replace 'refs/tags/', ''
          }
          echo "VERSION=$VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Build with PyInstaller
        run: |
          pyinstaller disttools/OOXmlBrowserOneDir.spec -- --for_windows
        shell: msys2 {0}

      - name: Prepare artifact (ZIP)
        run: |
          cd dist
          7z a -tzip "OOXmlBrowser-${{ env.VERSION }}-windows-portable.zip" OOXmlBrowser/
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: OOXmlBrowser-windows-${{ env.VERSION }}
          path: dist/OOXmlBrowser-${{ env.VERSION }}-windows-portable.zip

      - name: Create release (if tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/OOXmlBrowser-${{ env.VERSION }}-windows-portable.zip
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
