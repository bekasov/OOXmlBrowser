name: Build Linux

on:
  push:
    branches: [ "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.3)'
        required: false
        default: 'snapshot'

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Check girepository pkg-config
        run: pkg-config --modversion girepository-2.0 || echo "Not found"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt upgrade
          sudo apt install -y \
              libgtk-4-dev \
              libgtksourceview-5-dev \
              libgirepository-2.0-dev \
              gobject-introspection \
              libcairo2-dev \
              python3-dev \
              upx-ucl \
              binutils \
              bzip2 \
              tidy \
              libgtk-4-1 \
              libgtksourceview-5-0 \
              gir1.2-gtk-4.0 \
              gir1.2-gtksource-5 \
              gir1.2-glib-2.0 \
              gir1.2-gio-2.0 \
              gir1.2-girepository-3.0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller disttools/OOXmlBrowserOneDir.spec

      - name: Upload Linux artifact (folder)
        uses: actions/upload-artifact@v4
        with:
          name: OOXmlBrowser-linux
          path: dist/OOXmlBrowser

      - name: Create release (if tag or manual dispatch)
        if: >
          startsWith(github.ref, 'refs/tags/') || 
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/OOXmlBrowser-linux.tar.bz2
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

